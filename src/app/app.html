<div class="container">

  <h1>My Notes</h1>

  <div class="layout">

    <!-- LEFT COLUMN: ADD NOTES -->
    <div class="form">

      <h2>Write a note</h2>

      <input #title type="text" placeholder="Note title">

      <textarea #text placeholder="Write your note..."></textarea>

      <button (click)="addNote(title.value, text.value); title.value=''; text.value=''">
        Add Note
      </button>

    </div>


    <!-- RIGHT COLUMN: NOTES LIST -->
    <div class="notes-section">

      <h2>My Notes</h2>

      @if (notes.length === 0) {
        <p class="empty">No notes yet.</p>
      }

      <div class="notes">

        @for (note of notes; track $index) {

          <div class="note">

            <h3>{{ note.title }}</h3>

            <p>{{ note.text }}</p>

            <button class="delete" (click)="deleteNote($index)">
              Delete
            </button>

          </div>

        }

      </div>

    </div>

  </div>

</div>
