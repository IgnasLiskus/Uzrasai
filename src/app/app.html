
<div class="container mt-4">
  <h1 class="text-center mb-4">My Notes</h1>

  <div class="row">
    <div class="col-md-5">
      <app-note-form
  #noteForm
  (add)="addNote($event.title, $event.text)"
  (saveEdit)="updateNote($event.id, $event.title, $event.text)">
</app-note-form>
    </div>

    <div class="col-md-7">
      <app-note-list
  [notes]="notes()"
  (delete)="deleteNote($event)"
  (edit)="noteForm.startEditing($event)">
</app-note-list>
    </div>
  </div>
</div>
